[metadata]
name = audio-offset-finder
version = 0.5.5
author = Yves Raimond, Stephen Jolly, Chris Needham
author_email = stephen.jolly@rd.bbc.co.uk
url = https://github.com/bbcrd/audio-offset-finder
license = Apache License 2.0
description = Find the offset of an audio file within another audio file
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
  License :: OSI Approved :: Apache Software License
  Programming Language :: Python :: 3
  Programming Language :: Python :: 3 :: Only
  Programming Language :: Python :: 3.9
  Programming Language :: Python :: 3.10
  Programming Language :: Python :: 3.11
  Programming Language :: Python :: 3.12
  Programming Language :: Python :: 3.13
  Programming Language :: Python :: 3.14

[options]
packages = find:
python_requires = >=3.9
# SciPy 1.15.x macOS wheels fail to load on macOS 27+ (malformed __thread_bss
# section), and SciPy 1.16+ requires Python 3.11+, so Python 3.10 on macOS
# must skip 1.15.x
install_requires =
  librosa >= 0.10.2
  matplotlib >= 3.7.3
  numpy >= 1.22.3
  scipy >= 1.10.0, != 1.15.*; platform_system == "Darwin" and python_version < "3.11"
  scipy >= 1.10.0; platform_system != "Darwin" or python_version >= "3.11"

[options.extras_require]
test = pytest >= 6.2.5
dev =
  black >= 22.3.0

[options.entry_points]
console_scripts =
  audio-offset-finder = audio_offset_finder.cli:run
